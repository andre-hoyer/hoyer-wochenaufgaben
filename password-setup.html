<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Passwort-Hash erstellen</title><style>body{margin:0;background:#f4f2ff;color:#27253b;font:16px system-ui,sans-serif}.card{max-width:560px;margin:8vh auto;padding:28px;background:#fff;border-radius:22px;box-shadow:0 14px 38px #32276e1a}h1{margin-top:0}label{display:grid;gap:7px;font-weight:700}input,button,textarea{font:inherit;border-radius:12px}input{padding:12px;border:1px solid #cbc6df}button{margin-top:14px;padding:12px 16px;border:0;background:#5b4bdb;color:#fff;font-weight:800;cursor:pointer}textarea{box-sizing:border-box;width:100%;min-height:105px;margin-top:14px;padding:12px;border:1px solid #cbc6df;word-break:break-all}.muted{color:#716f83;line-height:1.45}.ok{color:#168657;font-weight:700}</style></head><body><main class="card"><h1>Passwort-Hash erstellen</h1><p class="muted">Diese Seite verarbeitet das Passwort ausschließlich auf deinem Gerät. Es wird nicht übertragen. Erzeuge das Passwort am besten zuvor in Apples Passwort-App.</p><label>Gemeinsames Passwort<input id="password" type="password" autocomplete="new-password"></label><button id="create" type="button">Hash erstellen</button><textarea id="result" readonly placeholder="Der Netlify-Wert erscheint hier"></textarea><button id="copy" type="button" hidden>Hash kopieren</button><p id="status" class="ok"></p></main><script>const hex=b=>[...new Uint8Array(b)].map(v=>v.toString(16).padStart(2,'0')).join('');document.querySelector('#create').onclick=async()=>{const password=document.querySelector('#password').value;if(password.length<12){alert('Bitte verwende mindestens 12 Zeichen.');return}const rounds=310000,salt=crypto.getRandomValues(new Uint8Array(16)),key=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveBits']),bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:rounds,hash:'SHA-256'},key,256),value=rounds+'$'+hex(salt)+'$'+hex(bits);document.querySelector('#result').value=value;document.querySelector('#copy').hidden=false;document.querySelector('#password').value='';document.querySelector('#status').textContent='Hash erstellt – das Klartextpasswort wurde verworfen.'};document.querySelector('#copy').onclick=async()=>{await navigator.clipboard.writeText(document.querySelector('#result').value);document.querySelector('#status').textContent='Hash kopiert.'}</script></body></html>
